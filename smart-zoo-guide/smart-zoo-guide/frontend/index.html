<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧動物園 AI 導覽</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h2>🦁 智慧動物園導覽</h2>

    <div class="card">
        <h3>1. 相機辨識 (Vision)</h3>
        <button onclick="takePicture()">📷 拍攝眼前動物</button>
        <p id="vision-result">尚未拍攝</p>
    </div>

    <div class="card">
        <h3>2. AI 語音/文字導覽 (RAG)</h3>
        <div id="chat-box">等待提問...</div>
        <input type="text" id="user-msg" placeholder="例如：老虎為什麼有條紋？">
        <button onclick="sendChat()">送出問題</button>
    </div>

    <div class="card">
        <h3>3. Agent 智慧推薦</h3>
        <button onclick="getRecommendation()">導覽下一站</button>
        <div id="recommendation-box">等待決策...</div>
    </div>

    <script src="js/app.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
