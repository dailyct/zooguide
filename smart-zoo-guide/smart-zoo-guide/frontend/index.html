<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧動物園導覽系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- 標題置於最上方 -->
    <header>
      <h1>🐾 智慧動物園導覽系統</h1>
      <p>探索園區生態 · AI 視覺問答 · 智慧路線推薦</p>
    </header>

    <!-- 下方內容以橫向 Grid 佈局依序展開 -->
    <div class="cards-container">
      <!-- 1. 影像辨識模組 -->
      <div class="card">
        <h3>📷 拍照辨識動物</h3>
        <button onclick="takePicture()">拍攝眼前動物</button>
        <div id="vision-result" class="result-box">尚未進行辨識</div>
      </div>

      <!-- 2. AI 導覽問答模組 -->
      <div class="card">
        <h3>💬 AI 導覽員問答</h3>
        <div class="input-group">
          <input type="text" id="user-msg" placeholder="問問看：老虎平時吃什麼？">
          <button onclick="sendChat()">送出</button>
        </div>
        <div id="chat-box" class="result-box">導覽員在線等待提問...</div>
      </div>

      <!-- 3. 動線推薦模組 -->
      <div class="card">
        <h3>🧭 個人化動線推薦</h3>
        <button onclick="getRecommendation()">規劃下一站路線</button>
        <div id="recommendation-box" class="result-box">點擊按鈕取得個人化推薦</div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
